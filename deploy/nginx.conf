# Upstream Gunicorn backend
upstream django_backend {
    server 127.0.0.1:8000;
}

# HTTP to HTTPS redirection
server {
    listen 80;
    listen [::]:80;
    server_name hamradio.privatedns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hamradio.privatedns.org;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hamradio.privatedns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamradio.privatedns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 25M;

    # Frontend Single Page App
    root /mnt/data/ham_radio_web_app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API and Admin reverse proxy
    location ~ ^/(api|admin|accounts)/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
    }

    # Django collected static files (Django Admin assets)
    location /static/ {
        alias /mnt/data/ham_radio_web_app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django media files (schematics & figures)
    location /media/ {
        alias /mnt/data/ham_radio_web_app/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
