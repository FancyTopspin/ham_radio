        <h1>OpenHam — FCC Amateur Radio License Study Platform</h1>
        <p>A modern, offline-first study platform to help you pass all three tiers of the US Federal Communications Commission (FCC) Amateur Radio Service exams: <strong>Technician Class (Element 2, 2026–2030)</strong>, <strong>General Class (Element 3, 2023–2027)</strong>, and <strong>Amateur Extra Class (Element 4, 2024–2028)</strong>.</p>
        
        <h2>Official NCVEC Question Pools Included</h2>
        <ul>
          <li><strong>Technician Class (Element 2)</strong>: 35 questions per exam, 26/35 (74%) to pass, 409 questions in pool (2026–2030 cycle, including Feb 19, 2026 errata).</li>
          <li><strong>General Class (Element 3)</strong>: 35 questions per exam, 26/35 (74%) to pass, 429 questions in pool (2023–2027 cycle).</li>
          <li><strong>Amateur Extra Class (Element 4)</strong>: 50 questions per exam, 37/50 (74%) to pass, 618 questions in pool (2024–2028 cycle).</li>
        </ul>

        <h2>Technician 2026–2030 Syllabus Subelements</h2>
        <ol>
          <li><strong>T1: Commission Rules</strong> — Purpose of amateur radio, license classes, station ID, operating control, Part 97.</li>
          <li><strong>T2: Operating Procedures</strong> — Repeater operations, CTCSS tones, simplex frequencies (146.520 MHz), emergency communications.</li>
          <li><strong>T3: Radio Wave Characteristics</strong> — Electromagnetic spectrum, propagation, line-of-sight, ionosphere, solar cycle.</li>
          <li><strong>T4: Amateur Radio Practices</strong> — Station equipment setup, digital multimeters, dummy loads, SWR meters.</li>
          <li><strong>T5: Electrical Principles & Math</strong> — Ohm's Law (E=I*R), Power formulas (P=E*I), metric prefixes (micro, milli, kilo, mega).</li>
          <li><strong>T6: Electrical Components & Schematics</strong> — Resistors, capacitors, inductors, diodes, transistors, circuit diagrams.</li>
          <li><strong>T7: Station Equipment</strong> — Transceivers, transmitters, receivers, filters, common-mode RF interference.</li>
          <li><strong>T8: Modulation & Digital Modes</strong> — FM, AM, SSB, CW, FT8, packet radio, amateur satellites.</li>
          <li><strong>T9: Antennas & Feed Lines</strong> — Dipoles, vertical antennas, Yagi beams, 50-ohm coaxial cable, SWR matching.</li>
          <li><strong>T0: Electrical & RF Safety</strong> — AC power safety, tower climbing, RF radiation exposure limits (MPE).</li>
        </ol>

        <h2>Pedagogical Capabilities</h2>
        <p>Includes passive read & study mode with emerald-highlighted answers, active recall quiz mode with smart choice shuffling, 4-stage Leitner spaced repetition (SRS) with 7-day retention decay, weak-spot mistake isolation drills, timed blueprint mock exams with question navigator, daily 5-question habit blitz, and national community callbook leaderboard.</p>
        <p>AI documentation index available at <a href="/llms.txt">llms.txt</a> and <a href="/llms-full.txt">llms-full.txt</a>.</p>
